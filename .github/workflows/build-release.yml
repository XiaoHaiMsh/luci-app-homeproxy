name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      commit_message: ${{ steps.commit.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate release tag
        id: tag
        run: echo "release_tag=homeproxy-$(date -u +%Y.%m.%d)-r$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve commit message
        id: commit
        run: |
          {
            echo "message<<COMMIT_MSG_EOF"
            git log -1 --pretty=%B
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

  build-homeproxy:
    name: Build homeproxy (apk/ipk)
    needs: tag
    runs-on: ubuntu-latest
    env:
      APK_SIGN_KEY: ''
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6

      - name: Checkout apk
        uses: actions/checkout@v6
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

      - name: Checkout po2lmo
        uses: actions/checkout@v6
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E rm -rf /var/lib/man-db/auto-update
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build jq unzip

          pushd apk-tools
          meson setup build \
            -Db_lto=true \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=libfetch \
            -Dzstd=false \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo -E meson install -C build --strip
          popd

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Setup APK signing key
        run: |
          if [ -n "${{ secrets.APK_SIGNING_KEY }}" ]; then
            echo "${{ secrets.APK_SIGNING_KEY }}" > /tmp/apk-signing.key
            chmod 600 /tmp/apk-signing.key
            openssl rsa -in /tmp/apk-signing.key -pubout -out .github/homeproxy.pub 2>/dev/null || \
            openssl ec  -in /tmp/apk-signing.key -pubout -out .github/homeproxy.pub 2>/dev/null || true
            echo "APK_SIGN_KEY=/tmp/apk-signing.key" >> $GITHUB_ENV
          else
            echo "No APK_SIGNING_KEY secret set — building unsigned package"
          fi

      - name: Build apk/ipk file
        run: |
          pushd .github
          fakeroot bash build-ipk.sh apk workflow_dispatch
          fakeroot bash build-ipk.sh ipk workflow_dispatch
          popd

      - name: Collect package
        run: |
          mkdir -p "$RUNNER_TEMP/output"
          cp -p .github/*.apk .github/*.ipk "$RUNNER_TEMP/output/"
          [ -f .github/homeproxy.pub ] && cp -p .github/homeproxy.pub "$RUNNER_TEMP/output/" || true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: homeproxy-packages
          path: ${{ runner.temp }}/output
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 这里直接去下载 shtorm-7 编译好的 OpenWrt 包，不再自己编译
  # ─────────────────────────────────────────────────────────────
  fetch-singbox:
    name: Fetch sing-box-extended OpenWrt packages
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Download OpenWrt packages from shtorm-7/sing-box-extended
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/output"

          echo "正在从 shtorm-7/sing-box-extended 下载最新 Release 中所有带 openwrt 的文件..."
          
          # 使用 gh 命令，通过通配符匹配所有 openwrt 相关的 ipk 和 apk 文件
          gh release download --repo shtorm-7/sing-box-extended \
            --pattern "*openwrt*" \
            --dir "$RUNNER_TEMP/output" \
            --clobber

          # 检查是否成功下载到文件
          if [ -z "$(ls -A "$RUNNER_TEMP/output")" ]; then
            echo "::error::未找到任何 OpenWrt 包，请检查上游 Release 是否包含 openwrt 字样。"
            exit 1
          fi

          echo "=== 成功下载的 OpenWrt 包列表 ==="
          ls -lh "$RUNNER_TEMP/output"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-openwrt-packages
          path: ${{ runner.temp }}/output
          if-no-files-found: error

  release:
    name: Publish combined release
    needs: [tag, build-homeproxy, fetch-singbox] # 注意这里改成了 fetch-singbox
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Flatten packages
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/artifacts" -type f -exec cp -t "$RUNNER_TEMP/release" {} +

          echo "=== SHA256SUMS (log only, not published to the release) ==="
          cd "$RUNNER_TEMP/release"
          sha256sum -- *

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.release_tag }}
          TITLE: ${{ needs.tag.outputs.release_tag }}
          NOTES: ${{ needs.tag.outputs.commit_message }}
        run: |
          cd "$RUNNER_TEMP/release"

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release_notes.txt"

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release_notes.txt" \
            -- * \
            || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
